<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F0NDHUB</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--line:#262c47;--text:#e8ebf7;--mute:#8b93b5;--accent:#4aa3ff;--danger:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(15,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0}
.acts{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{background:var(--accent);color:#06101f;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.6)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:1400px;margin:0 auto;padding:20px}
#search{width:100%;max-width:520px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;height:100%;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.cover{aspect-ratio:16/9;width:100%;object-fit:cover;background:#0b0e1a;display:block}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:17px;color:var(--accent);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.meta{margin-top:auto;display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
dialog{width:min(720px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .22s ease}
dialog[open]::backdrop{animation:fade .22s ease}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop{animation:none}}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dbody h2{margin:0}
.desc{white-space:pre-wrap;color:#cfd4ec}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:14px}
input[type=text],input[type=url],input[type=password],textarea{width:100%;background:#0f1220;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);outline:0;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=url]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent)}
input.in-ok,input.in-ok:focus{border-color:#4ade80;box-shadow:0 0 0 1px #4ade80}
input.in-bad,input.in-bad:focus{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
textarea{min-height:110px;resize:vertical}
.hide{display:none!important}
.like.on{background:var(--accent);color:#06101f}
#auth{width:min(420px,94vw)}
#auth .btn{width:100%;text-align:center}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.sep{text-align:center;color:var(--mute);font-size:13px}
.err{color:var(--danger);margin:0;font-size:14px}
.status{font-size:13px}
.status:empty{display:none}
.status.ok{color:#4ade80}
.status.bad{color:var(--danger)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
#toast{position:fixed;inset:auto;top:16px;left:50%;transform:translateX(-50%);margin:0;border:0;background:#000;color:#fff;padding:10px 18px;border-radius:8px;max-width:90vw;text-align:center;overflow:visible}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ava{border:0;padding:0;border-radius:50%;width:36px;height:36px;overflow:hidden;cursor:pointer;background:none}
.ava img,.pava{width:100%;height:100%;object-fit:cover;display:block}
.pava{width:96px;height:96px;border-radius:50%;flex:none}
.locked{opacity:.45}
.small{width:min(360px,94vw)!important}
.idrow{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.idrow b{color:var(--text)}
#cv{width:100%;max-width:300px;touch-action:none;border-radius:8px;align-self:center}
header{flex-wrap:wrap}
header h1{flex:1 1 auto;min-width:max-content}
.acts .btn{height:36px;min-height:36px;padding:0 14px}
.acts .btn.plus{width:36px;padding:0;font-size:22px;line-height:1;border-radius:50%}
#who{color:var(--mute);font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.eq .btn{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:14px}
.fname{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
@media (max-width:640px){header{padding:10px 14px}#who{order:3;flex-basis:100%;max-width:100%;text-align:right}main{padding:14px}.dbody{padding:16px}}
.tools{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px}
.sorts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.chip{min-height:38px;padding:0 20px;border-radius:10px;border:0;background:#262a3f;color:var(--text);font-weight:600;cursor:pointer}
.chip.on{background:#f1f2f6;color:#0f1220}
@media (max-width:480px){.sorts{flex-wrap:nowrap}.chip{flex:1;padding:0 8px}}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 0;color:var(--mute);font-size:14px}
.when{color:var(--mute);font-size:12px}
button,.card,.chip,.link{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active,.chip:active{opacity:.85}
.vhead{display:flex;align-items:flex-start;gap:12px}
.vhead h2{flex:1;min-width:0;word-break:break-word}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vgrid{display:grid;gap:14px}
.vmedia,.vtext{display:flex;flex-direction:column;gap:12px;min-width:0}
.vtext .btn{width:100%}
.vcover{aspect-ratio:16/9;width:100%;object-fit:cover;border-radius:10px;background:#0b0e1a;display:block}
.vvideo{aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;background:#000}
.vvideo iframe{width:100%;height:100%;border:0;display:block}
.stat{color:var(--mute);font-size:14px}
@media (min-width:860px){#view{width:min(1000px,94vw)}.vgrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
#gbusy{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:20px;background:rgba(15,18,32,.92);color:var(--text);flex-direction:column;gap:12px;align-items:center;justify-content:center;font-weight:600;text-align:center;touch-action:none;overscroll-behavior:contain}
#gbusy:popover-open{display:flex}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.on{background:#4ade80}
.dot.off{background:var(--danger)}
.uinfo{flex:1;min-width:0}
.uinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uact{display:flex;gap:6px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.pen{background:transparent;color:#a78bfa;border:1px solid #a78bfa}
.acts .btn.mgr{width:36px;padding:0;border-radius:50%;background:transparent;border:1px solid var(--line);color:#22c55e}
.btn svg{width:18px;height:18px;fill:currentColor;display:block}
.mgr svg,.pm svg{width:22px;height:22px}
@media (max-width:640px){.uact{width:100%}.uact .btn{flex:1}}
.acts .btn.pm{width:36px;padding:0;border-radius:50%;background:transparent;border:1px solid var(--line);color:#a78bfa}
.pitem{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.pitem.dim{opacity:.55}
.pitem .vcover{max-width:420px}
@media (max-width:420px){.acts{gap:6px}.acts .btn{padding:0 10px;font-size:14px}.acts .btn.mgr,.acts .btn.pm,.acts .btn.plus{width:34px;padding:0}.ava{width:34px;height:34px}}
</style>
</head>
<body>
<header>
  <h1>F0NDHUB</h1>
  <span id="who" class="hide"></span>
  <div class="acts">
    <button class="btn mgr hide" id="mgrBtn" aria-label="Quản lý khách hàng"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 15.2a8 8 0 0 1-6-2.7c.1-2 4-3.1 6-3.1s5.9 1.1 6 3.1a8 8 0 0 1-6 2.7z"/></svg></button>
    <button class="btn pm hide" id="pmBtn" aria-label="Quản lý bài viết"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
    <button class="btn plus hide" id="newBtn" aria-label="Đăng bài">+</button>
    <button class="btn ghost" id="loginBtn">Đăng nhập</button>
    <button class="btn danger hide" id="logoutBtn">Đăng xuất</button>
    <button class="ava hide" id="avaBtn" aria-label="Trang cá nhân"><img id="avaImg" alt=""></button>
  </div>
</header>
<main>
  <div class="tools">
    <input id="search" type="search" placeholder="Tìm bài viết...">
    <div class="sorts" id="sorts">
      <button class="chip on" data-sort="new">Mới nhất</button>
      <button class="chip" data-sort="pop">Phổ biến</button>
      <button class="chip" data-sort="old">Cũ nhất</button>
    </div>
  </div>
  <div class="loading" id="loading"><div class="spin"></div><div>Đang tải</div></div>
  <div class="grid" id="grid"></div>
  <div class="empty hide" id="empty">Chưa có bài viết nào.</div>
  <div class="loading hide" id="more"><div class="spin"></div><div>Đang tải</div></div>
  <div id="sent" style="height:1px"></div>
</main>

<dialog id="view">
  <div class="dbody">
    <div class="vhead"><h2 id="vTitle"></h2><button class="xbtn" data-close aria-label="Đóng">✕</button></div>
    <div class="vgrid">
      <div class="vmedia">
        <img class="vcover" id="vCover" alt="">
        <div class="vvideo hide" id="vVideo"></div>
      </div>
      <div class="vtext">
        <div class="desc" id="vDesc"></div>
        <a class="btn" id="vLink" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost like" id="vLike"></button>
      <span class="stat" id="vViews"></span>
      <span class="stat" id="vRate"></span>
      <span class="stat" id="vWhen"></span>
    </div>
    <div class="row hide" id="adminRow">
      <button class="btn ghost" id="editBtn">Sửa</button>
      <button class="btn danger" id="delBtn">Xóa</button>
    </div>
  </div>
</dialog>

<dialog id="form">
  <div class="dbody">
    <h2 id="fHead">Đăng bài mới</h2>
    <div class="fld">Ảnh bìa
      <div class="row"><button type="button" class="btn ghost" id="fPick">Chọn ảnh bìa</button></div>
      <span class="fname" id="fName">Chưa chọn ảnh</span>
      <input type="file" id="fFile" accept="image/*" class="hide">
    </div>
    <img class="cover hide" id="fPrev" alt="" style="border-radius:8px">
    <label>Tiêu đề <input type="text" id="fTitle" maxlength="120"></label>
    <label>Mô tả <textarea id="fDesc" maxlength="5000"></textarea></label>
    <label>Liên kết <input type="url" id="fLink" placeholder="https://..."></label>
    <label>Tên nút liên kết <input type="text" id="fBtn" maxlength="40" placeholder="Nhập tên nút liên kết để chuyển hướng"></label>
    <label>Liên kết YouTube (Không bắt buộc) <input type="url" id="fVideo" placeholder="https://..."></label>
    <div class="row eq">
      <button class="btn" id="fSave">Đăng bài</button>
      <button class="btn ghost" data-close>Hủy</button>
    </div>
  </div>
</dialog>

<dialog id="auth">
  <div class="dbody">
    <h2>Welcome !</h2>
    <div id="loginView" class="dbody" style="padding:0">
      <label>Tên đăng nhập <input type="text" id="lUser" autocomplete="username" autocapitalize="none"></label>
      <label>Mật khẩu <input type="password" id="lPass" autocomplete="current-password"></label>
      <button class="btn" id="lBtn" disabled>Đăng nhập</button>
      <div class="sep">hoặc</div>
      <button class="btn ghost" id="gBtn">Đăng nhập bằng Google</button>
      <div class="sep">Chưa có tài khoản? <button class="link" id="toReg">Đăng Ký</button></div>
    </div>
    <div id="regView" class="dbody hide" style="padding:0">
      <label>Tên đăng nhập <input type="text" id="rUser" autocomplete="off" autocapitalize="none" placeholder="3–20 ký tự"></label>
      <div class="status" id="rStatus"></div>
      <label>Tên người dùng / Tên hiển thị <input type="text" id="rName" maxlength="30"></label>
      <label>Mật khẩu <input type="password" id="rPass" autocomplete="new-password"></label>
      <div class="meter hide" id="rMeter"><i id="rBar"></i></div>
      <div class="status" id="rStrength"></div>
      <label>Xác nhận lại mật khẩu <input type="password" id="rPass2" autocomplete="new-password"></label>
      <div class="status" id="rMatch"></div>
      <button class="btn" id="rBtn" disabled>Tạo tài khoản</button>
      <div class="sep">Đã có tài khoản? <button class="link" id="toLogin">Đăng nhập</button></div>
    </div>
    <p class="err" id="aErr"></p>
    <button class="btn ghost" data-close>Đóng</button>
  </div>
</dialog>
<dialog id="prof">
  <div class="dbody">
    <h2>Trang cá nhân</h2>
    <div class="row" style="gap:16px"><img class="pava" id="pAva" alt=""><button class="btn ghost" id="pAvaBtn">Đổi ảnh đại diện</button><input type="file" id="pFile" accept="image/*" class="hide"></div>
    <div class="idrow">Account ID <b id="pId"></b></div>
    <label id="pUserL">Tên đăng nhập <input type="text" id="pUser" autocapitalize="none" autocomplete="off"></label>
    <label id="pNameL">Tên người dùng / Tên hiển thị <input type="text" id="pName" maxlength="30"></label>
    <div id="pPassBox" class="dbody" style="padding:0">
      <label>Mật khẩu <input type="password" id="pPass" autocomplete="new-password" placeholder="Để trống nếu không đổi"></label>
      <div class="status" id="pStrength"></div>
      <label>Xác nhận lại mật khẩu <input type="password" id="pPass2" autocomplete="new-password"></label>
      <div class="status" id="pMatch"></div>
    </div>
    <p class="err" id="pErr"></p>
    <div class="row eq"><button class="btn" id="pSave">Lưu</button><button class="btn danger" id="pDel">Xoá tài khoản</button></div>
    <button class="btn ghost" data-close>Đóng</button>
  </div>
</dialog>
<dialog id="cropDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0" id="cropTitle"></h3>
    <canvas id="cv" width="300" height="300"></canvas>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
    <div class="row eq"><button class="btn" id="cOk">Lưu làm ảnh hồ sơ</button><button class="btn ghost" id="cNo">Hủy</button></div>
  </div>
</dialog>
<dialog id="delDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0" id="delMsg"></h3>
    <div class="row eq"><button class="btn danger" id="dYes">Tôi đồng ý</button><button class="btn ghost" id="dNo">Hủy</button></div>
  </div>
</dialog>
<dialog id="reDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0">Nhập mật khẩu hiện tại để xác nhận</h3>
    <input type="password" id="rePass" autocomplete="current-password">
    <p class="err" id="reErr"></p>
    <div class="row eq"><button class="btn" id="reOk">Xác nhận</button><button class="btn ghost" id="reNo">Hủy</button></div>
  </div>
</dialog>
<dialog id="mgr">
  <div class="dbody">
    <div class="vhead"><h2>Quản lý khách hàng</h2><button class="xbtn" data-close aria-label="Đóng">✕</button></div>
    <div id="ulist"></div>
  </div>
</dialog>
<dialog id="uEdit" class="small">
  <div class="dbody">
    <h3 style="margin:0">Sửa tài khoản</h3>
    <label id="ueUserL">Tên đăng nhập <input type="text" id="ueUser" autocapitalize="none" autocomplete="off"></label>
    <label>Tên người dùng / Tên hiển thị <input type="text" id="ueName" maxlength="30"></label>
    <label id="ueNewL">Mật khẩu mới (để trống nếu không đổi) <input type="password" id="ueNew" autocomplete="new-password"></label>
    <label id="ueNew2L">Xác nhận lại mật khẩu <input type="password" id="ueNew2" autocomplete="new-password"></label>
    <p class="err" id="ueErr"></p>
    <div class="row eq"><button class="btn" id="ueSave">Lưu</button><button class="btn ghost" data-close>Hủy</button></div>
  </div>
</dialog>
<dialog id="pm">
  <div class="dbody">
    <div class="vhead"><h2>Quản lý bài viết</h2><button class="xbtn" data-close aria-label="Đóng">✕</button></div>
    <div id="pmlist"></div>
    <button class="btn ghost hide" id="pmMore">Tải thêm</button>
  </div>
</dialog>
<div id="gbusy" popover="manual"><div class="spin"></div><div id="gbusyMsg"></div></div>
<div id="toast" popover="manual"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqh916i2WtEgvcoHXlK9wtHZpSXrxPM0w",
  authDomain: "f0ndhub.firebaseapp.com",
  projectId: "f0ndhub",
  appId: "1:25492132379:web:27e1ea4c2418293149debe"
};
const ADMIN_EMAIL = "ngoctuanffa@gmail.com";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), posts = db.collection("posts");
const $ = id => document.getElementById(id);
const tm = p => p.createdAt ? p.createdAt.toMillis() : Date.now();
const fmt = p => {
  const d = new Date(tm(p));
  return d.toLocaleTimeString("vi-VN", {hour: "2-digit", minute: "2-digit"}) + " · " + d.toLocaleDateString("vi-VN");
};
let sortMode = "new";
let list = [], current = null, editingId = null, coverData = "", thumbData = "", coverChanged = false, myLike = false, likeBusy = false, isAdmin = false;

let toastTimer;
const toast = m => {
  const t = $("toast");
  t.textContent = m;
  if (!t.matches(":popover-open")) t.showPopover();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidePopover(), 2500);
};
const esc = s => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

const authDlg = $("auth"), USER_RE = /^[a-z0-9_]{3,20}$/;

function setBusy(on, msg) {
  const g = $("gbusy");
  gBusy = on;
  $("gbusyMsg").textContent = msg || "";
  if (on) { if (!g.matches(":popover-open")) g.showPopover(); }
  else if (g.matches(":popover-open")) g.hidePopover();
  document.documentElement.style.overflow = on ? "hidden" : "";
}
["pointerdown", "pointerup", "click", "dblclick", "touchstart", "touchmove", "touchend", "wheel", "keydown", "keyup", "keypress", "contextmenu"].forEach(t =>
  window.addEventListener(t, e => { if (gBusy) { e.preventDefault(); e.stopPropagation(); } }, {capture: true, passive: false}));
document.addEventListener("cancel", e => { if (gBusy) e.preventDefault(); }, true);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function mark(inputId, statusId, text, cls) {

  i.classList.toggle("in-ok", cls === "ok");
  i.classList.toggle("in-bad", cls === "bad");
  s.textContent = text || "";
  s.className = "status " + (cls || "");
}
function strength(p) {
  const c = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(p)).length;
  if (p.length < 7) return {lv: 0, t: "Quá ngắn (cần trên 6 ký tự)", w: 15, col: "#ff5d73"};
  if (c <= 1) return {lv: 0, t: "Yếu", w: 30, col: "#ff5d73"};
  if (c === 2 && p.length < 10) return {lv: 1, t: "Trung bình", w: 62, col: "#fbbf24"};
  return {lv: 2, t: "Mạnh", w: 100, col: "#4ade80"};
}

    throw {code: "banned"};
  }
}

$("rBtn").onclick = async () => {

  if (!USER_RE.test(u)) return aErr("Tên đăng nhập chỉ gồm a-z, 0-9, _ (3–20 ký tự)");
  if (!name) return aErr("Hãy nhập tên hiển thị");

  if (p !== $("rPass2").value) return aErr(MATCH_MSG);
  aErr("");
  registering = true;
  const email = crypto.randomUUID().replace(/-/g, "") + "@users.f0ndhub.invalid";
  localStorage.setItem("pendingReg", JSON.stringify({u, name, email}));
  setBusy(true, "Đang tạo tài khoản");
  try { await runReg(u, name, p, email); } catch (e) { await failReg(e); }

async function runReg(u, name, p, email) {
  const user = (await auth.createUserWithEmailAndPassword(email, p)).user;
  await finishReg(user, u, name, email);
}

async function newAccountId() {
  for (let i = 0; i < 8; i++) {
    const n = String(10000000 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * 90000000));
    if (!(await db.collection("accountIds").doc(n).get()).exists) return n;
  }
  throw {code: "id-failed"};
}

async function finishReg(user, u, name, email) {
  const ref = db.collection("users").doc(user.uid);
  if (!(await ref.get()).exists) {
    const id = await newAccountId();
    const b = db.batch();
    b.set(db.collection("usernames").doc(u), {uid: user.uid, email});
    b.set(db.collection("accountIds").doc(id), {uid: user.uid});
    b.set(ref, {username: u, displayName: name, accountId: id, email});
    await b.commit();
  }
  await user.updateProfile({displayName: name});
  localStorage.removeItem("pendingReg");
  await auth.signOut();
  registering = false;
  applyUser(null);
  setBusy(false);
  resetReg();
  resetLogin();
  showView("login");
  toast("Tạo tài khoản thành công");
}

async function failReg(e) {
  if (auth.currentUser) await auth.currentUser.delete().catch(() => {});
  await auth.signOut().catch(() => {});
  localStorage.removeItem("pendingReg");
  registering = false;
  applyUser(null);
  setBusy(false);
  aErr(e.code === "taken" || e.code === "permission-denied"
    ? "Tên đăng nhập đã tồn tại, tài khoản không được tạo"
    : "Tạo tài khoản lỗi: " + e.code);
}

const PAGE = 12;
const ORDER = {new: ["createdAt", "desc"], old: ["createdAt", "asc"], pop: ["likes", "desc"]};
let last = null, done = false, busyLoad = false, gen = 0, ord = ORDER.new;
const qText = () => $("search").value.trim().toLowerCase();
const fold = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
function ranked() {
  const q = fold($("search").value.trim());
  if (!q) return list;
  const r = [];
  list.forEach(p => {
    const i = p._t.indexOf(q), j = p._d.indexOf(q);
    const sc = i >= 0 ? i : j >= 0 ? 1000 + j : -1;
    if (sc >= 0) r.push([sc, p]);
  });
  r.sort((a, b) => a[0] - b[0]);
  return r.map(x => x[1]);
}
const cardHtml = p => `
    <article class="card" tabindex="0" data-id="${p.id}">
      <img class="cover" src="${p.thumb || p.cover || ""}" alt="" loading="lazy" decoding="async">
      <div class="body"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
        <div class="when">${fmt(p)}</div>
        <div class="meta"><span class="lk">♥ ${p.likes || 0}</span><span class="vw">${p.views || 0} lượt xem</span></div>
      </div>
    </article>`;
function syncEmpty() {
  $("empty").classList.toggle("hide", !done || $("grid").children.length > 0);
}
function renderAll() {
  $("grid").innerHTML = ranked().map(cardHtml).join("");
  syncEmpty();
}
function syncCard(p) {
  const c = $("grid").querySelector('[data-id="' + p.id + '"]');
  if (!c) return;
  c.querySelector(".lk").textContent = "♥ " + (p.likes || 0);
  c.querySelector(".vw").textContent = (p.views || 0) + " lượt xem";
}
async function loadMore() {
  if (busyLoad || done) return;
  busyLoad = true;
  const g = gen;
  $("more").classList.toggle("hide", list.length === 0);
  try {
    const run = () => {
      let q = posts.orderBy(ord[0], ord[1]);
      if (last) q = q.startAfter(last);
      return q.limit(PAGE).get();
    };
    let s;
    try { s = await run(); }
    catch (e) {
      if (last || ord === ORDER.new) throw e;
      ord = ORDER.new;
      s = await run();
    }
    if (g !== gen) return;
    if (!last && !s.docs.length && ord !== ORDER.new) {
      ord = ORDER.new;
      s = await run();
      if (g !== gen) return;
    }
    const add = s.docs.map(d => ({id: d.id, ...d.data()})).filter(p => p.hidden !== true);
    add.forEach(p => { p._t = fold(p.title); p._d = fold(p.desc); });
    list.push(...add);
    if (s.docs.length) last = s.docs[s.docs.length - 1];
    if (s.docs.length < PAGE) done = true;
    $("loading").classList.add("hide");
    if (qText()) renderAll(); else $("grid").insertAdjacentHTML("beforeend", add.map(cardHtml).join(""));
  } catch (e) {
    if (g === gen) {
      done = true;
      $("loading").classList.add("hide");
      toast("Không tải được dữ liệu: " + e.code);
      $("empty").textContent = "Không tải được bài đăng (" + e.code + "). Chạm để thử lại";
      $("empty").onclick = reload;
    }
  } finally {
    if (g === gen) {
      busyLoad = false;
      $("more").classList.add("hide");
      syncEmpty();
      if (!done) {
        if (qText()) loadMore();
        else { io.unobserve($("sent")); io.observe($("sent")); }
      }
    }
  }
}
function reload() {
  gen++;
  list = [];
  last = null;
  done = false;
  busyLoad = false;
  $("grid").innerHTML = "";
  ord = ORDER[sortMode];
  $("empty").textContent = "Chưa có bài viết nào.";
  $("empty").onclick = null;
  $("empty").classList.add("hide");
  $("loading").classList.remove("hide");
  loadMore();
}
const io = new IntersectionObserver(en => { if (en[0].isIntersecting) loadMore(); }, {rootMargin: "400px"});
io.observe($("sent"));
let rq = 0;

  return m ? m[1] : "";
}

const lkKey = uid => "lk_" + uid;
function saveLocalLike(uid, id, on) {
  let a = [];
  try { a = JSON.parse(localStorage.getItem(lkKey(uid)) || "[]"); } catch (e) {}
  a = a.filter(x => x !== id);
  if (on) a.push(id);
  try { localStorage.setItem(lkKey(uid), JSON.stringify(a)); } catch (e) {}
}
async function refreshLike(id) {
  const u = auth.currentUser;
  let a = [];
  if (u) { try { a = JSON.parse(localStorage.getItem(lkKey(u.uid)) || "[]"); } catch (e) {} }
  myLike = !!u && a.includes(id);
  const p = list.find(x => x.id === id);
  if (p) paintLike(p);
  if (!u) return;
  try {
    const d = await posts.doc(id).collection("likes").doc(u.uid).get();
    if (current !== id || !auth.currentUser || auth.currentUser.uid !== u.uid) return;
    myLike = d.exists;
    saveLocalLike(u.uid, id, myLike);
    if (p) paintLike(p);
  } catch (e) {}
}
let ipKey = sessionStorage.getItem("ipk") || "";
async function viewerKey() {
  if (ipKey) return ipKey;
  let raw = "";
  try { raw = (await (await fetch("https://api.ipify.org?format=json")).json()).ip; } catch (e) {}
  if (!raw) {
    raw = localStorage.getItem("dev") || crypto.randomUUID();
    localStorage.setItem("dev", raw);
  }
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("f0ndhub:" + raw));
  ipKey = [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join("");
  sessionStorage.setItem("ipk", ipKey);
  return ipKey;
}
async function countView(p) {
  if (localStorage.getItem("sv_" + p.id)) return;
  try {
    const k = await viewerKey();
    await posts.doc(p.id).collection("viewers").doc(k).set({t: firebase.firestore.FieldValue.serverTimestamp()});
  } catch (e) {
    if (e.code === "permission-denied") localStorage.setItem("sv_" + p.id, 1);
    return;
  }
  localStorage.setItem("sv_" + p.id, 1);
  p.views = (p.views || 0) + 1;
  syncCard(p);
  if (current === p.id && $("view").open) fillView(p);
  posts.doc(p.id).update({views: firebase.firestore.FieldValue.increment(1)}).catch(() => {});
}
function openPost(id) {
  const p = list.find(x => x.id === id);
  if (!p) return;
  current = id;
  myLike = false;
  fillView(p);
  setVideo(p);
  $("view").showModal();
  loadFull(p);
  refreshLike(id);
  countView(p);
}

      <div class="uinfo"><b>${esc(x.displayName || "Chưa đặt tên")}</b><div class="stat">${x.username ? "@" + esc(x.username) + " · " : ""}#${esc(x.accountId || "")}${x.banned ? " · Đã bị cấm" : ""}</div></div>
      <div class="uact">
        <button class="btn sm pen" data-act="edit" aria-label="Sửa"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
        ${x.id === me ? "" : `<button class="btn sm ${x.banned ? "ghost" : "danger"}" data-act="ban">${x.banned ? "Mở Cấm" : "Cấm"}</button><button class="btn sm danger" data-act="del">Xoá</button>`}
      </div>
    </div>`).join("") : '<div class="empty">Chưa có tài khoản nào.</div>';
}
$("mgrBtn").onclick = () => {
  usersData = [];
  $("ulist").innerHTML = '<div class="loading"><div class="spin"></div><div>Đang tải</div></div>';
  $("mgr").showModal();
  if (unUsers) unUsers();
  unUsers = db.collection("users").onSnapshot(s => {
    usersData = s.docs.map(d => ({id: d.id, ...d.data()}));
    renderUsers();
  }, e => toast("Không tải được danh sách: " + e.code));
  clearInterval(mgrTimer);
  mgrTimer = setInterval(renderUsers, 30000);
};
$("mgr").addEventListener("close", () => {
  if (unUsers) { unUsers(); unUsers = null; }
  clearInterval(mgrTimer);
});
function openUEdit(x) {
  ueTarget = x;
  $("ueUser").value = x.username || "";
  $("ueName").value = x.displayName || "";
  $("ueNew").value = "";
  $("ueNew2").value = "";
  $("ueUserL").classList.toggle("hide", !x.username);
  $("ueNewL").classList.toggle("hide", !x.username);
  $("ueNew2L").classList.toggle("hide", !x.username);
  $("ueErr").textContent = "";
  $("uEdit").showModal();
}
async function adminSetPassword(x, nu, nn, np) {
  const app = firebase.apps.find(a => a.name === "sec") || firebase.initializeApp(firebaseConfig, "sec");
  const sa = app.auth();
  const email = crypto.randomUUID().replace(/-/g, "") + "@users.f0ndhub.invalid";
  const c = await sa.createUserWithEmailAndPassword(email, np);
  await c.user.updateProfile({displayName: nn});
  const nid = c.user.uid;
  await sa.signOut();
  const rest = {...x};
  delete rest.id;
  const b = db.batch();
  b.set(db.collection("users").doc(nid), {...rest, username: nu, displayName: nn, email});
  b.delete(db.collection("users").doc(x.id));
  if (nu !== x.username) b.delete(db.collection("usernames").doc(x.username));
  b.set(db.collection("usernames").doc(nu), {uid: nid, email});
  if (x.accountId) b.set(db.collection("accountIds").doc(x.accountId), {uid: nid});
  await b.commit();
}
$("ueSave").onclick = async () => {
  const x = ueTarget, err = m => $("ueErr").textContent = m || "";
  const nu = norm($("ueUser").value) || x.username, nn = $("ueName").value.trim(), np = $("ueNew").value;
  const chU = !!x.username && nu !== x.username, chN = nn !== (x.displayName || ""), chP = !!x.username && !!np;
  err("");
  if (chU && !USER_RE.test(nu)) return err("Tên đăng nhập chỉ gồm a-z, 0-9, _ (3–20 ký tự)");
  if (!nn) return err("Hãy nhập tên hiển thị");
  if (chP) {
    if (strength(np).lv < 1) return err("Mật khẩu quá yếu. Hãy đặt lại: trên 6 ký tự, đạt mức Trung bình trở lên");
    if (np !== $("ueNew2").value) return err("Mật khẩu không khớp vui lòng thử lại");
  }
  if (!chU && !chN && !chP) return $("uEdit").close();
  setBusy(true, chP ? "Đang cập nhật mật khẩu mới" : "Đang lưu");
  try {
    if (chP) await adminSetPassword(x, nu, nn, np);
    else {
      const b = db.batch(), upd = {};
      if (chU) {
        b.delete(db.collection("usernames").doc(x.username));
        b.set(db.collection("usernames").doc(nu), {uid: x.id, email: x.email || toEmail(x.username)});
        upd.username = nu;
      }
      if (chN) upd.displayName = nn;
      b.update(db.collection("users").doc(x.id), upd);
      await b.commit();
    }
    setBusy(false);
    $("uEdit").close();
    toast("Đã lưu");
  } catch (e) {
    setBusy(false);
    err(e.code === "permission-denied" && chU ? "Tên đăng nhập đã tồn tại" : e.code === "auth/weak-password" ? "Mật khẩu quá yếu" : "Lưu lỗi: " + e.code);
  }
};
$("ulist").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.closest(".urow").dataset.uid, x = usersData.find(y => y.id === id);
  if (!x) return;
  if (b.dataset.act === "edit") return openUEdit(x);
  if (b.dataset.act === "ban") {
    setBusy(true, x.banned ? "Đang mở cấm" : "Đang cấm");
    try {
      await db.collection("users").doc(id).update({banned: !x.banned});
      setBusy(false);
      toast(x.banned ? "Đã mở cấm" : "Đã cấm tài khoản");
    } catch (er) {
      setBusy(false);
      toast("Lỗi: " + er.code);
    }
    return;
  }
  if (!(await askConfirm("Bạn chắc chắn muốn xoá tài khoản này ?"))) return;
  setBusy(true, "Đang xoá Tài Khoản, vui lòng đợi");
  try {
    const bt = db.batch();
    if (x.username) bt.delete(db.collection("usernames").doc(x.username));
    if (x.accountId) bt.delete(db.collection("accountIds").doc(x.accountId));
    bt.delete(db.collection("users").doc(id));
    await bt.commit();
    setBusy(false);
    toast("Đã xóa tài khoản");
  } catch (er) {
    setBusy(false);
    toast("Xóa lỗi: " + er.code);
  }
});
let pmDocs = [], pmLast = null, pmDone = false, pmBusy = false;
function pmRender() {
  $("pmlist").innerHTML = pmDocs.length ? pmDocs.map(p => {
    const img = p.thumb || p.cover || "";
    return `
    <div class="pitem${p.hidden ? " dim" : ""}" data-id="${p.id}">
      <b>${esc(p.title)}</b>
      <div class="stat">${fmt(p)}${p.hidden ? " · Đang ẩn" : ""}</div>
      ${img ? `<img class="vcover" src="${img}" alt="">` : ""}
      <div class="row eq">
        <button class="btn sm pen" data-pa="edit" aria-label="Chỉnh sửa"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
        <button class="btn sm danger" data-pa="del" aria-label="Xoá"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
        <button class="btn sm ghost" data-pa="hide" aria-label="Ẩn hoặc hiện">${p.hidden ? `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>`}</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">Chưa có bài viết nào.</div>';
  $("pmMore").classList.toggle("hide", pmDone);
}
async function pmLoad(reset) {
  if (pmBusy) return;
  pmBusy = true;
  if (reset) {
    pmDocs = [];
    pmLast = null;
    pmDone = false;
    $("pmlist").innerHTML = '<div class="loading"><div class="spin"></div><div>Đang tải</div></div>';
    $("pmMore").classList.add("hide");
  }
  try {
    let q = posts.orderBy("createdAt", "desc");
    if (pmLast) q = q.startAfter(pmLast);
    const s = await q.limit(20).get();
    pmDocs.push(...s.docs.map(d => ({id: d.id, ...d.data()})));
    if (s.docs.length) pmLast = s.docs[s.docs.length - 1];
    if (s.docs.length < 20) pmDone = true;
    pmRender();
  } catch (e) {
    toast("Không tải được bài viết: " + e.code);
  }
  pmBusy = false;
}
$("pmBtn").onclick = () => {
  $("pm").showModal();
  pmLoad(true);
};
$("pmMore").onclick = () => pmLoad(false);
$("pmlist").addEventListener("click", async e => {
  const b = e.target.closest("[data-pa]");
  if (!b) return;
  const id = b.closest(".pitem").dataset.id, p = pmDocs.find(x => x.id === id);
  if (!p) return;
  if (b.dataset.pa === "edit") return openForm(p);
  if (b.dataset.pa === "hide") {
    setBusy(true, p.hidden ? "Đang hiện bài viết" : "Đang ẩn bài viết");
    try {
      await posts.doc(id).update({hidden: !p.hidden});
      p.hidden = !p.hidden;
      pmRender();
      setBusy(false);
      toast(p.hidden ? "Đã ẩn bài viết" : "Đã hiện bài viết");
      reload();
    } catch (er) {
      setBusy(false);
      toast("Lỗi: " + er.code);
    }
    return;
  }
  if (!(await askConfirm("Bạn chắc chắn muốn xoá bài viết này ?"))) return;
  setBusy(true, "Đang xoá bài viết");
  try {
    await deletePost(id);
    pmDocs = pmDocs.filter(x => x.id !== id);
    pmRender();
    setBusy(false);
    toast("Đã xóa bài viết");
    reload();
  } catch (er) {
    setBusy(false);
    toast("Xóa lỗi: " + er.code);
  }
});
</script>
