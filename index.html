<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F0NDHUB</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--line:#262c47;--text:#e8ebf7;--mute:#8b93b5;--accent:#4aa3ff;--danger:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(15,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0}
.acts{display:flex;gap:8px;align-items:center}
.btn{background:var(--accent);color:#06101f;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.6)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:1400px;margin:0 auto;padding:20px}
#search{width:100%;max-width:520px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;height:100%;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.cover{aspect-ratio:16/9;width:100%;object-fit:cover;background:#0b0e1a;display:block}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:17px;color:var(--accent);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.meta{margin-top:auto;display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
dialog{width:min(720px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .22s ease}
dialog[open]::backdrop{animation:fade .22s ease}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop{animation:none}}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dbody h2{margin:0}
.desc{white-space:pre-wrap;color:#cfd4ec}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:14px}
input[type=text],input[type=url],input[type=password],textarea{width:100%;background:#0f1220;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);outline:0;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=url]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent)}
input.in-ok,input.in-ok:focus{border-color:#4ade80;box-shadow:0 0 0 1px #4ade80}
input.in-bad,input.in-bad:focus{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
textarea{min-height:110px;resize:vertical}
.hide{display:none!important}
.like.on{background:var(--accent);color:#06101f}
#auth{width:min(420px,94vw)}
#auth .btn{width:100%;text-align:center}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.sep{text-align:center;color:var(--mute);font-size:13px}
.err{color:var(--danger);margin:0;font-size:14px}
.status{font-size:13px}
.status:empty{display:none}
.status.ok{color:#4ade80}
.status.bad{color:var(--danger)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
#toast{position:fixed;inset:auto;top:16px;left:50%;transform:translateX(-50%);margin:0;border:0;background:#000;color:#fff;padding:10px 18px;border-radius:8px;max-width:90vw;text-align:center;overflow:visible}
.busy{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(15,18,32,.92);font-weight:600;text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ava{border:0;padding:0;border-radius:50%;width:36px;height:36px;overflow:hidden;cursor:pointer;background:none}
.ava img,.pava{width:100%;height:100%;object-fit:cover;display:block}
.pava{width:96px;height:96px;border-radius:50%;flex:none}
.locked{opacity:.45}
.small{width:min(360px,94vw)!important}
.idrow{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.idrow b{color:var(--text)}
#cv{width:100%;max-width:300px;touch-action:none;border-radius:8px;align-self:center}
header{flex-wrap:wrap}
header h1{flex:1;min-width:0}
.acts .btn{height:36px;min-height:36px;padding:0 14px}
.acts .btn.plus{width:36px;padding:0;font-size:22px;line-height:1;border-radius:50%}
#who{color:var(--mute);font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.eq .btn{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:14px}
.fname{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
@media (max-width:640px){header{padding:10px 14px}#who{order:3;flex-basis:100%;max-width:100%;text-align:right}main{padding:14px}.dbody{padding:16px}}
.tools{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px}
.sorts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.chip{min-height:38px;padding:0 20px;border-radius:10px;border:0;background:#262a3f;color:var(--text);font-weight:600;cursor:pointer}
.chip.on{background:#f1f2f6;color:#0f1220}
@media (max-width:480px){.sorts{flex-wrap:nowrap}.chip{flex:1;padding:0 8px}}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 0;color:var(--mute);font-size:14px}
.when{color:var(--mute);font-size:12px}
button,.card,.chip,.link{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active,.chip:active{opacity:.85}
</style>
</head>
<body>
<header>
  <h1>F0NDHUB</h1>
  <span id="who" class="hide"></span>
  <div class="acts">
    <button class="btn plus hide" id="newBtn" aria-label="Đăng bài">+</button>
    <button class="btn ghost" id="loginBtn">Đăng nhập</button>
    <button class="btn danger hide" id="logoutBtn">Đăng xuất</button>
    <button class="ava hide" id="avaBtn" aria-label="Trang cá nhân"><img id="avaImg" alt=""></button>
  </div>
</header>
<main>
  <div class="tools">
    <input id="search" type="search" placeholder="Tìm bài viết...">
    <div class="sorts" id="sorts">
      <button class="chip on" data-sort="new">Mới nhất</button>
      <button class="chip" data-sort="pop">Phổ biến</button>
      <button class="chip" data-sort="old">Cũ nhất</button>
    </div>
  </div>
  <div class="loading" id="loading"><div class="spin"></div><div>Đang tải bài đăng...</div></div>
  <div class="grid" id="grid"></div>
  <div class="empty hide" id="empty">Chưa có bài viết nào.</div>
  <div class="loading hide" id="more"><div class="spin"></div><div>Đang tải thêm...</div></div>
  <div id="sent" style="height:1px"></div>
</main>

<dialog id="view">
  <img class="cover" id="vCover" alt="">
  <div class="dbody">
    <h2 id="vTitle"></h2>
    <div class="when" id="vWhen"></div>
    <div class="desc" id="vDesc"></div>
    <div class="row">
      <a class="btn" id="vLink" target="_blank" rel="noopener noreferrer"></a>
      <button class="btn ghost like" id="vLike"></button>
      <span id="vViews" style="color:var(--mute);font-size:14px"></span>
    </div>
    <div class="row hide" id="adminRow">
      <button class="btn ghost" id="editBtn">Sửa</button>
      <button class="btn danger" id="delBtn">Xóa</button>
    </div>
    <div class="row"><button class="btn ghost" data-close>Đóng</button></div>
  </div>
</dialog>

<dialog id="form">
  <div class="dbody">
    <h2 id="fHead">Đăng bài mới</h2>
    <div class="fld">Ảnh bìa
      <div class="row"><button type="button" class="btn ghost" id="fPick">Chọn ảnh bìa</button><span class="fname" id="fName">Chưa chọn ảnh</span></div>
      <input type="file" id="fFile" accept="image/*" class="hide">
    </div>
    <img class="cover hide" id="fPrev" alt="" style="border-radius:8px">
    <label>Tiêu đề <input type="text" id="fTitle" maxlength="120"></label>
    <label>Mô tả <textarea id="fDesc" maxlength="5000"></textarea></label>
    <label>Liên kết <input type="url" id="fLink" placeholder="https://..."></label>
    <label>Tên nút liên kết <input type="text" id="fBtn" maxlength="40" placeholder="Nhập tên nút liên kết để chuyển hướng"></label>
    <div class="row eq">
      <button class="btn" id="fSave">Đăng bài</button>
      <button class="btn ghost" data-close>Hủy</button>
    </div>
  </div>
  <div class="busy hide" id="fBusy"><div class="spin"></div><div id="fBusyMsg"></div></div>
</dialog>

<dialog id="auth">
  <div class="dbody">
    <h2>Welcome !</h2>
    <div id="loginView" class="dbody" style="padding:0">
      <label>Tên đăng nhập <input type="text" id="lUser" autocomplete="username" autocapitalize="none"></label>
      <label>Mật khẩu <input type="password" id="lPass" autocomplete="current-password"></label>
      <button class="btn" id="lBtn" disabled>Đăng nhập</button>
      <div class="sep">hoặc</div>
      <button class="btn ghost" id="gBtn">Đăng nhập bằng Google</button>
      <div class="sep">Chưa có tài khoản? <button class="link" id="toReg">Đăng Ký</button></div>
    </div>
    <div id="regView" class="dbody hide" style="padding:0">
      <label>Tên đăng nhập <input type="text" id="rUser" autocomplete="off" autocapitalize="none" placeholder="3–20 ký tự"></label>
      <div class="status" id="rStatus"></div>
      <label>Tên người dùng / Tên hiển thị <input type="text" id="rName" maxlength="30"></label>
      <label>Mật khẩu <input type="password" id="rPass" autocomplete="new-password"></label>
      <div class="meter hide" id="rMeter"><i id="rBar"></i></div>
      <div class="status" id="rStrength"></div>
      <label>Xác nhận lại mật khẩu <input type="password" id="rPass2" autocomplete="new-password"></label>
      <div class="status" id="rMatch"></div>
      <button class="btn" id="rBtn" disabled>Tạo tài khoản</button>
      <div class="sep">Đã có tài khoản? <button class="link" id="toLogin">Đăng nhập</button></div>
    </div>
    <p class="err" id="aErr"></p>
    <button class="btn ghost" data-close>Đóng</button>
  </div>
  <div class="busy hide" id="busy"><div class="spin"></div><div id="busyMsg"></div></div>
</dialog>
<dialog id="prof">
  <div class="dbody">
    <h2>Trang cá nhân</h2>
    <div class="row" style="gap:16px"><img class="pava" id="pAva" alt=""><button class="btn ghost" id="pAvaBtn">Đổi ảnh đại diện</button><input type="file" id="pFile" accept="image/*" class="hide"></div>
    <div class="idrow">Account ID <b id="pId"></b></div>
    <label id="pUserL">Tên đăng nhập <input type="text" id="pUser" autocapitalize="none" autocomplete="off"></label>
    <label id="pNameL">Tên người dùng / Tên hiển thị <input type="text" id="pName" maxlength="30"></label>
    <div id="pPassBox" class="dbody" style="padding:0">
      <label>Mật khẩu <input type="password" id="pPass" autocomplete="new-password" placeholder="Để trống nếu không đổi"></label>
      <div class="status" id="pStrength"></div>
      <label>Xác nhận lại mật khẩu <input type="password" id="pPass2" autocomplete="new-password"></label>
      <div class="status" id="pMatch"></div>
    </div>
    <p class="err" id="pErr"></p>
    <div class="row eq"><button class="btn" id="pSave">Lưu</button><button class="btn danger" id="pDel">Xoá tài khoản</button></div>
    <button class="btn ghost" data-close>Đóng</button>
  </div>
  <div class="busy hide" id="pBusy"><div class="spin"></div><div>Đang xoá Tài Khoản, vui lòng đợi</div></div>
</dialog>
<dialog id="cropDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0" id="cropTitle"></h3>
    <canvas id="cv" width="300" height="300"></canvas>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
    <div class="row eq"><button class="btn" id="cOk">Lưu làm ảnh hồ sơ</button><button class="btn ghost" id="cNo">Hủy</button></div>
  </div>
</dialog>
<dialog id="delDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0">Bạn chắc chắn muốn xoá tài khoản ?</h3>
    <div class="row eq"><button class="btn danger" id="dYes">Tôi đồng ý</button><button class="btn ghost" id="dNo">Hủy</button></div>
  </div>
</dialog>
<dialog id="reDlg" class="small">
  <div class="dbody">
    <h3 style="margin:0">Nhập mật khẩu hiện tại để xác nhận</h3>
    <input type="password" id="rePass" autocomplete="current-password">
    <div class="row eq"><button class="btn" id="reOk">Xác nhận</button><button class="btn ghost" id="reNo">Hủy</button></div>
  </div>
</dialog>
<div id="toast" popover="manual"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqh916i2WtEgvcoHXlK9wtHZpSXrxPM0w",
  authDomain: "f0ndhub.firebaseapp.com",
  projectId: "f0ndhub",
  appId: "1:25492132379:web:27e1ea4c2418293149debe"
};
const ADMIN_EMAIL = "ngoctuanffa@gmail.com";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), posts = db.collection("posts");
const $ = id => document.getElementById(id);
const tm = p => p.createdAt ? p.createdAt.toMillis() : Date.now();
const fmt = p => {
  const d = new Date(tm(p));
  return d.toLocaleTimeString("vi-VN", {hour: "2-digit", minute: "2-digit"}) + " · " + d.toLocaleDateString("vi-VN");
};
let sortMode = "new";
let list = [], current = null, editingId = null, coverData = "", isAdmin = false;

let toastTimer;
const toast = m => {
  const t = $("toast");
  t.textContent = m;
  if (!t.matches(":popover-open")) t.showPopover();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidePopover(), 2500);
};
const esc = s => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
const liked = () => JSON.parse(localStorage.getItem("liked") || "[]");

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

const authDlg = $("auth"), USER_RE = /^[a-z0-9_]{3,20}$/;
const toEmail = u => u + "@users.f0ndhub.invalid";
const norm = s => s.trim().toLowerCase();
const aErr = m => $("aErr").textContent = m || "";
let registering = false, userOk = false, chkTimer, chkSeq = 0;
let resume = null;
try { resume = JSON.parse(localStorage.getItem("pendingReg") || "null"); } catch (e) {}
if (resume) registering = true;
function setBusy(on, msg) {
  $("busy").classList.toggle("hide", !on);
  $("busyMsg").textContent = msg || "Đang tạo tài khoản...";
}
authDlg.oncancel = e => { if (!$("busy").classList.contains("hide")) e.preventDefault(); };

function showView(v) {
  $("loginView").classList.toggle("hide", v !== "login");
  $("regView").classList.toggle("hide", v !== "reg");
  aErr("");
}
function mark(inputId, statusId, text, cls) {
  const i = $(inputId), s = $(statusId);
  i.classList.toggle("in-ok", cls === "ok");
  i.classList.toggle("in-bad", cls === "bad");
  s.textContent = text || "";
  s.className = "status " + (cls || "");
}
function strength(p) {
  const c = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(p)).length;
  if (p.length < 7) return {lv: 0, t: "Quá ngắn (cần trên 6 ký tự)", w: 15, col: "#ff5d73"};
  if (c <= 1) return {lv: 0, t: "Yếu", w: 30, col: "#ff5d73"};
  if (c === 2 && p.length < 10) return {lv: 1, t: "Trung bình", w: 62, col: "#fbbf24"};
  return {lv: 2, t: "Mạnh", w: 100, col: "#4ade80"};
}
function updateRegBtn() {
  const p = $("rPass").value;
  $("rBtn").disabled = !(userOk && $("rName").value.trim() && strength(p).lv >= 1 && p === $("rPass2").value);
}
function updLogin() {
  $("lBtn").disabled = !($("lUser").value.trim() && $("lPass").value);
}
function resetReg() {
  clearTimeout(chkTimer);
  chkSeq++;
  userOk = false;
  ["rUser", "rName", "rPass", "rPass2"].forEach(i => $(i).value = "");
  mark("rUser", "rStatus", "", "");
  mark("rPass", "rStrength", "", "");
  mark("rPass2", "rMatch", "", "");
  $("rBar").style.width = 0;
  $("rMeter").classList.add("hide");
  updateRegBtn();
}
function resetLogin() {
  $("lUser").value = "";
  $("lPass").value = "";
  updLogin();
}

$("loginBtn").onclick = () => {
  resetReg();
  resetLogin();
  showView("login");
  authDlg.showModal();
};
$("toReg").onclick = () => { resetReg(); showView("reg"); };
$("toLogin").onclick = () => { resetLogin(); showView("login"); };
$("logoutBtn").onclick = () => auth.signOut();
$("lUser").oninput = updLogin;
$("lPass").oninput = updLogin;
$("rName").oninput = updateRegBtn;

$("lBtn").onclick = async () => {
  const u = norm($("lUser").value), p = $("lPass").value;
  if (!u || !p) return aErr("Nhập tên đăng nhập và mật khẩu");
  try {
    const ud = await db.collection("usernames").doc(u).get();
    if (!ud.exists) throw {code: "auth/invalid-credential"};
    await auth.signInWithEmailAndPassword(ud.data().email || toEmail(u), p);
    resetLogin();
    authDlg.close();
    toast("Đăng nhập thành công");
  } catch (e) {
    aErr(["auth/invalid-credential", "auth/user-not-found", "auth/wrong-password", "auth/invalid-email"].includes(e.code)
      ? "Sai tên đăng nhập hoặc mật khẩu"
      : "Đăng nhập lỗi: " + e.code);
  }
};

$("gBtn").onclick = async () => {
  const g = $("gBtn"), label = g.textContent;
  g.disabled = true;
  g.textContent = "Đang mở Google...";
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    authDlg.close();
    toast("Đăng nhập thành công");
  } catch (e) {
    aErr(e.code === "auth/unauthorized-domain"
      ? "Tên miền này chưa được thêm vào Authorized domains trong Firebase"
      : "Đăng nhập Google lỗi: " + e.code);
  }
  g.disabled = false;
  g.textContent = label;
};

$("rUser").oninput = () => {
  clearTimeout(chkTimer);
  const u = norm($("rUser").value), seq = ++chkSeq;
  userOk = false;
  updateRegBtn();
  if (!u) return mark("rUser", "rStatus", "", "");
  if (u.length < 3) return mark("rUser", "rStatus", "Không hợp lệ, tên đăng nhập phải có ít nhất 3 ký tự", "bad");
  if (u.length > 20) return mark("rUser", "rStatus", "Không hợp lệ, tên đăng nhập tối đa 20 ký tự", "bad");
  if (!USER_RE.test(u)) return mark("rUser", "rStatus", "Không hợp lệ, chỉ dùng chữ a-z, số 0-9 và dấu _", "bad");

async function runReg(u, name, p, email) {
  const user = (await auth.createUserWithEmailAndPassword(email, p)).user;
  await finishReg(user, u, name, email);
}

async function newAccountId() {
  for (let i = 0; i < 8; i++) {
    const n = String(10000000 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * 90000000));
    if (!(await db.collection("accountIds").doc(n).get()).exists) return n;
  }
  throw {code: "id-failed"};
}

async function finishReg(user, u, name, email) {
  const ref = db.collection("users").doc(user.uid);
  if (!(await ref.get()).exists) {
    const id = await newAccountId();
    const b = db.batch();
    b.set(db.collection("usernames").doc(u), {uid: user.uid, email});
    b.set(db.collection("accountIds").doc(id), {uid: user.uid});
    b.set(ref, {username: u, displayName: name, accountId: id, email});
    await b.commit();
  }
  await user.updateProfile({displayName: name});
  localStorage.removeItem("pendingReg");
  await auth.signOut();
  registering = false;
  applyUser(null);
  setBusy(false);
  resetReg();
  resetLogin();
  showView("login");
  toast("Tạo tài khoản thành công");
}

const PAGE = 6;

async function loadMore() {
  if (busyLoad || done) return;
  busyLoad = true;
  const g = gen;
  $("more").classList.toggle("hide", list.length === 0);
  try {
    const run = () => {
      let q = posts.orderBy(ord[0], ord[1]);
      if (last) q = q.startAfter(last);
      return q.limit(PAGE).get();
    };
    let s;
    try { s = await run(); }
    catch (e) {
      if (last || ord === ORDER.new) throw e;
      ord = ORDER.new;
      s = await run();
    }
    if (g !== gen) return;
    if (!last && !s.docs.length && ord !== ORDER.new) {
      ord = ORDER.new;
      s = await run();
      if (g !== gen) return;
    }
    const add = s.docs.map(d => ({id: d.id, ...d.data()}));
    list.push(...add);
    if (s.docs.length) last = s.docs[s.docs.length - 1];
    if (s.docs.length < PAGE) done = true;
    $("loading").classList.add("hide");
    if (qText()) renderAll(); else $("grid").insertAdjacentHTML("beforeend", add.map(cardHtml).join(""));
  } catch (e) {

      $("empty").textContent = "Không tải được bài đăng (" + e.code + "). Chạm để thử lại";
      $("empty").onclick = reload;
    }
  } finally {
    if (g === gen) {

      $("more").classList.add("hide");

}
function reload() {
  gen++;

  last = null;
  done = false;
  busyLoad = false;

$("cNo").onclick = () => $("cropDlg").close();
$("cOk").onclick = () => {
  const f = frame(), k = cfg.outW / cfg.fw, o = document.createElement("canvas");
  o.width = cfg.outW;
  o.height = cfg.outH;
  o.getContext("2d").drawImage(im, (ox - f.x) * k, (oy - f.y) * k, im.width * sc * k, im.height * sc * k);
  const url = o.toDataURL("image/jpeg", cfg.q);
  $("cropDlg").close();
  cropDone(url);
};

function askPass() {
  return new Promise(res => {
    $("rePass").value = "";
    $("reDlg").showModal();
    $("reOk").onclick = () => { const v = $("rePass").value; $("reDlg").close(); res(v); };
    $("reNo").onclick = () => { $("reDlg").close(); res(null); };
  });
}
async function reauth(u) {
  if (u.providerData.some(x => x.providerId === "password")) {
    const pw = await askPass();
    if (pw === null) throw {code: "cancel"};
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pw));
  } else {
    await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
  }
}
async function withRecent(u, fn) {
  try { return await fn(); }
  catch (e) {
    if (e.code !== "auth/requires-recent-login") throw e;
    await reauth(u);
    return await fn();
  }
}
async function sameAsOld(u, p) {
  try {
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, p));
    return true;
  } catch (e) {
    if (e.code === "auth/too-many-requests") throw e;
    return false;
  }
}

$("pSave").onclick = async () => {
  const u = auth.currentUser, d = P.d, err = m => $("pErr").textContent = m || "";
  err("");
  const nu = norm($("pUser").value), nn = $("pName").value.trim(), pw = $("pPass").value;
  const chU = P.isPw && !P.lu && nu !== d.username, chN = !P.ln && nn !== d.displayName;
  if (chU && !USER_RE.test(nu)) return err("Tên đăng nhập chỉ gồm a-z, 0-9, _ (3–20 ký tự)");
  if (!nn) return err("Hãy nhập tên hiển thị");
  if (P.isPw && pw) {
    if (strength(pw).lv < 1) return err("Mật khẩu quá yếu. Hãy đặt lại: trên 6 ký tự, đạt mức Trung bình trở lên");
    if (pw !== $("pPass2").value) return err("Mật khẩu không khớp vui lòng thử lại");
  }
  $("pSave").disabled = true;
  try {
    if (P.isPw && pw && await sameAsOld(u, pw)) return toast("Mật khẩu không được giống mật khẩu cũ");
    const b = db.batch(), upd = {}, ts = firebase.firestore.FieldValue.serverTimestamp();
    if (chU) {
      if (d.username) b.delete(db.collection("usernames").doc(d.username));
      b.set(db.collection("usernames").doc(nu), {uid: u.uid, email: d.email || u.email});
      upd.username = nu;
      upd.usernameChangedAt = ts;
    }
    if (chN) { upd.displayName = nn; if (!isAdmin) upd.nameChangedAt = ts; }
    if (P.newAvatar) upd.avatar = P.newAvatar;
    if (Object.keys(upd).length) {
      b.set(db.collection("users").doc(u.uid), upd, {merge: true});
      try { await b.commit(); }
      catch (e) { return err(chU && e.code === "permission-denied" ? "Tên đăng nhập đã tồn tại" : "Lưu lỗi: " + e.code); }
      if (chN) await u.updateProfile({displayName: nn});
    }
    if (P.isPw && pw) await withRecent(u, () => u.updatePassword(pw));
    const s = await db.collection("users").doc(u.uid).get();
    P = {d: s.data(), isPw: P.isPw, newAvatar: null};
    fillProfile();
    applyUser(auth.currentUser);
    toast("Đã lưu thay đổi");
  } catch (e) {
    if (e.code !== "cancel") err(["auth/invalid-credential", "auth/wrong-password"].includes(e.code) ? "Sai mật khẩu" : "Lưu lỗi: " + e.code);
  } finally {
    $("pSave").disabled = false;
  }
};

$("pDel").onclick = () => { if (P && P.isPw) $("delDlg").showModal(); };
$("dNo").onclick = () => $("delDlg").close();
const setPBusy = on => $("pBusy").classList.toggle("hide", !on);
$("prof").oncancel = e => { if (!$("pBusy").classList.contains("hide")) e.preventDefault(); };
$("dYes").onclick = async () => {
  $("delDlg").close();
  const u = auth.currentUser, d = P.d;
  if (!P.isPw) return;
  try {
    await reauth(u);
    setPBusy(true);
    const b = db.batch();
    if (d.username) b.delete(db.collection("usernames").doc(d.username));
    if (d.accountId) b.delete(db.collection("accountIds").doc(d.accountId));
    b.delete(db.collection("users").doc(u.uid));
    await b.commit();
    try { localStorage.removeItem("ava_" + u.uid); } catch (e) {}
    await u.delete();
    setPBusy(false);
    $("prof").close();
    toast("Đã xóa tài khoản");
  } catch (e) {
    setPBusy(false);
    if (e.code !== "cancel") toast(["auth/invalid-credential", "auth/wrong-password"].includes(e.code) ? "Sai mật khẩu" : "Xóa tài khoản lỗi: " + e.code);
  }
};
</script>
